<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Newhawk Trace Viewer</title>
  <style>
    :root {
      font-family: "Source Code Pro", Consolas, monospace;
      color: #1f2430;
      background: #f5f7fc;
    }
    body {
      margin: 0;
      padding: 24px;
      background: inherit;
      color: inherit;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 24px;
      font-weight: 600;
    }
    h2 {
      margin: 24px 0 12px;
      font-size: 20px;
      font-weight: 600;
    }
    .panel {
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
    }
    .panel label {
      font-size: 14px;
      color: #4b566d;
    }
    input[type="range"] {
      width: 240px;
    }
    button {
      background: #4d6cf7;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.2);
    }
    button:hover {
      background: #3b5add;
    }
    #status {
      font-size: 13px;
      color: #5c647a;
    }
    .coverage-panel,
    .graph-panel {
      border: 1px solid #d6deef;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 24px;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }
    .coverage-header,
    .graph-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
      gap: 12px;
    }
    .coverage-title,
    .graph-title {
      font-size: 16px;
      font-weight: 600;
    }
    .coverage-meta,
    .graph-meta {
      font-size: 13px;
      color: #5f6c86;
    }
    .opcode-table {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
    }
    .trace-graph {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .graph-row {
      display: grid;
      grid-template-columns: 220px 120px 1fr;
      gap: 12px;
      align-items: center;
      padding: 6px 8px;
      border-radius: 4px;
      background: #f3f6fc;
      border: 1px solid #dbe3f4;
    }
    .graph-trace {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    .graph-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f94144;
      flex-shrink: 0;
    }
    .graph-connector {
      font-size: 12px;
      color: #6c7794;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .graph-parent {
      font-size: 13px;
      color: inherit;
    }
    .opcode-row {
      display: grid;
      grid-template-columns: 140px 1fr 1fr;
      gap: 12px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #f7f9fd;
      align-items: center;
    }
    .opcode-row.highlight {
      background: #fff5dd;
      box-shadow: 0 0 0 2px #f4c96f inset;
    }
    .opcode-addr {
      font-weight: 600;
      font-size: 13px;
    }
    .opcode-name {
      font-size: 13px;
    }
    .opcode-coverage {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 13px;
    }
    .trace-badge {
      padding: 2px 6px;
      border-radius: 4px;
      color: #0f1115;
      font-weight: 600;
      font-size: 12px;
    }
    .trace-card {
      border: 1px solid #d6deef;
      border-left-width: 4px;
      margin-bottom: 20px;
      padding: 12px;
      border-radius: 4px;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }
    .trace-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
      gap: 8px;
    }
    .trace-title {
      font-size: 16px;
      font-weight: 600;
    }
    .trace-meta {
      font-size: 12px;
      color: #5d667e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .trace-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    .column {
      background: #f8faff;
      border-radius: 4px;
      padding: 8px;
      border: 1px solid #dbe3f4;
      min-height: 140px;
      display: flex;
      flex-direction: column;
    }
    .column-title {
      font-size: 13px;
      color: #6a7795;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .snap-link {
      color: #2c5ed2;
      cursor: pointer;
      text-decoration: underline;
    }
    .snap-link:hover,
    .snap-link:focus-visible {
      color: #1c3f8f;
      outline: none;
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.42;
      flex: 1;
    }
    .hidden {
      display: none;
    }
    @media (max-width: 800px) {
      .opcode-row {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 600px) {
      body {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <h1>Trace viewer (output.log)</h1>
  <div class="panel">
    <label>
      Coverage up to trace
      <input id="traceSlider" type="range" min="0" value="0" step="1">
      <span id="sliderValue">0</span>/<span id="traceTotal">0</span>
    </label>
    <button id="reloadButton" type="button">Reload output.log</button>
    <span id="status"></span>
  </div>

  <section class="coverage-panel">
    <div class="coverage-header">
      <div class="coverage-title">Opcode Coverage</div>
      <div class="coverage-meta">
        Showing traces: <span id="coverageCount">0</span>/<span id="coverageTotal">0</span>
      </div>
    </div>
    <div id="opcodeTable" class="opcode-table"></div>
  </section>

  <section class="graph-panel">
    <div class="graph-header">
      <div class="graph-title">Trace Links</div>
      <div class="graph-meta">Parent snapshots and patch targets</div>
    </div>
    <div id="traceGraph" class="trace-graph">
      <div class="trace-meta">Rendering…</div>
    </div>
  </section>

  <h2>Traces</h2>
  <div id="traceContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    if (window.mermaid) {
      window.mermaid.initialize({
        startOnLoad: false,
        theme: "default",
        securityLevel: "loose"
      });
    }
    const colorPalette = [
      "#f94144", "#f3722c", "#f8961e", "#f9844a", "#f9c74f",
      "#90be6d", "#43aa8b", "#577590", "#8e63d3", "#ff6f91"
    ];
    const ansiRegex = /\u001b\[[0-9;]*m/g;
    let traceData = [];

    const slider = document.getElementById("traceSlider");
    const sliderValue = document.getElementById("sliderValue");
    const traceTotalEl = document.getElementById("traceTotal");
    const statusEl = document.getElementById("status");
    const container = document.getElementById("traceContainer");
    const reloadButton = document.getElementById("reloadButton");
    const opcodeTable = document.getElementById("opcodeTable");
    const coverageCount = document.getElementById("coverageCount");
    const coverageTotal = document.getElementById("coverageTotal");
    const traceGraph = document.getElementById("traceGraph");

    let opcodeIndex = [];
    let highlightedAddress = null;
    let highlightedRow = null;
    let snapNodeMeta = {};
    let currentGraphId = null;
    const escapeId = (value) => {
      if (window.CSS && CSS.escape) {
        return CSS.escape(value);
      }
      return value.replace(/([.#:[\],])/g, "\\$1");
    };

    async function loadLog() {
      statusEl.textContent = "Loading output.log…";
      container.innerHTML = "";
      try {
        const response = await fetch("output.log", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Failed to fetch output.log (${response.status})`);
        }
        const text = await response.text();
        traceData = parseTraces(text);
        if (!traceData.length) {
          statusEl.textContent = "No traces found.";
          opcodeIndex = [];
          traceTotalEl.textContent = "0";
          coverageTotal.textContent = "0";
          coverageCount.textContent = "0";
          sliderValue.textContent = "0";
          opcodeTable.innerHTML = "<div class=\"trace-meta\">No trace records present.</div>";
          traceGraph.innerHTML = "<div class=\"trace-meta\">No trace links.</div>";
          slider.max = 0;
          slider.value = 0;
          slider.disabled = true;
          return;
        }
        traceTotalEl.textContent = traceData.length;
        slider.max = traceData.length;
        slider.value = traceData.length;
        slider.disabled = false;
        opcodeIndex = buildOpcodeIndex(traceData);
        coverageTotal.textContent = traceData.length;
        statusEl.textContent = `Loaded ${traceData.length} traces`;
        renderCoverage(traceData.length);
        renderGraph(traceData.length);
        renderTraces();
      } catch (err) {
        statusEl.textContent = err.message;
        slider.disabled = true;
      }
    }

    function resolveSnapshotIndex(parentTrace, snapshotIr) {
      if (!parentTrace || snapshotIr == null || !Array.isArray(parentTrace.snapshots)) {
        return null;
      }
      const match = parentTrace.snapshots.find((snap) => snap.ir === snapshotIr);
      if (match) {
        return match.index;
      }
      if (Number.isInteger(snapshotIr) && parentTrace.snapshots[snapshotIr]) {
        return snapshotIr;
      }
      return null;
    }

    function parseTraces(text) {
      const lines = text.split(/\r?\n/);
      const traces = [];
      let current = null;
      let mode = null;
      let pendingSide = null;

      for (const raw of lines) {
        const line = raw.trimEnd();
        if (line.startsWith("Record start")) {
          if (current) {
            traces.push(current);
          }
          const parentTraceIndex = pendingSide ? pendingSide.parentTrace : null;
          const snapshotIr = pendingSide ? pendingSide.snapshotIr : null;
          const parentTraceData = parentTraceIndex != null ? traces[parentTraceIndex] : null;
          const snapshotIndex = resolveSnapshotIndex(parentTraceData, snapshotIr);
          current = {
            title: line,
            disassemblyHeader: "",
            bytecode: [],
            asm: [],
            ir: [],
            notes: [],
            recordOps: [],
            kind: line.includes("side") || pendingSide ? "side" : "main",
            parentTrace: parentTraceIndex,
            snapshotIr,
            snapshotIndex,
            links: [],
            snapshots: []
          };
          pendingSide = null;
          mode = "bytecode";
          continue;
        }
        if (!current) {
          continue;
        }
        if (line.startsWith("Disassembly:")) {
          current.disassemblyHeader = line;
          mode = "asm";
          continue;
        }
        if (line.startsWith("SNAP[")) {
          mode = "ir";
          current.ir.push(line);
          const pcMatch = line.match(/pc=(0x[0-9a-fA-F]+)/i);
          const irMatch = line.match(/SNAP\[ir=(\d+)/i);
          const irValue = irMatch ? parseInt(irMatch[1], 10) : null;
          if (pcMatch) {
            const { display } = normalizeAddress(pcMatch[1]);
            current.snapshots.push({
              index: current.snapshots.length,
              ir: Number.isNaN(irValue) ? null : irValue,
              pc: display
            });
          } else {
            current.snapshots.push({
              index: current.snapshots.length,
              ir: Number.isNaN(irValue) ? null : irValue,
              pc: null
            });
          }
          continue;
        }
        if (line.startsWith("Try side trace")) {
          current.notes.push(line);
          const parts = line.split(/\s+/);
          const parentTrace = parseInt(parts[3], 10);
          const snapshotIr = parseInt(parts[4], 10);
          pendingSide = {
            parentTrace: Number.isNaN(parentTrace) ? null : parentTrace,
            snapshotIr: Number.isNaN(snapshotIr) ? null : snapshotIr
          };
          continue;
        }
        if (line.startsWith("record op:")) {
          current.bytecode.push(line);
          const parsed = parseRecordOp(line);
          if (parsed) {
            current.recordOps.push(parsed);
          }
          continue;
        }
        if (mode === "bytecode") {
          if (line) {
            current.bytecode.push(line);
          }
        } else if (mode === "asm") {
          current.asm.push(line);
          const linkMatch = line.match(/Link to trace\s+(\d+)(?:.*snap exit\s+(\d+))?/i);
          if (linkMatch) {
            current.links.push({
              type: "patch",
              target: parseInt(linkMatch[1], 10),
              snapshot: linkMatch[2] ? parseInt(linkMatch[2], 10) : null
            });
          }
          const loopMatch = line.match(/Loopback\s*\(snap exit\s+(\d+)\)/i);
          if (loopMatch) {
            current.links.push({
              type: "loop",
              target: null,
              snapshot: parseInt(loopMatch[1], 10)
            });
          }
        } else if (mode === "ir") {
          if (line || current.ir.length) {
            current.ir.push(line);
          }
        }
      }
      if (current) {
        traces.push(current);
      }
      return traces;
    }

    function parseRecordOp(line) {
      const parts = line.split("record op:")[1]?.trim();
      if (!parts) {
        return null;
      }
      const [addrRaw, opcode] = parts.split(/\s+/, 2);
      if (!addrRaw || !opcode) {
        return null;
      }
      const { display, value } = normalizeAddress(addrRaw);
      return { address: display, value, opcode: opcode.trim() };
    }

    function normalizeAddress(raw) {
      const match = raw.match(/0x([0-9a-fA-F]+)/g);
      if (!match) {
        return { display: raw, value: BigInt(0) };
      }
      const hex = match[match.length - 1].replace(/^0x/, "");
      const display = `0x${hex.toLowerCase()}`;
      return { display, value: BigInt(`0x${hex}`) };
    }

    function buildOpcodeIndex(traces) {
      const map = new Map();
      traces.forEach((trace, traceIndex) => {
        trace.recordOps.forEach((op, seq) => {
          if (!map.has(op.address)) {
            map.set(op.address, {
              address: op.address,
              value: op.value,
              history: []
            });
          }
          map.get(op.address).history.push({
            traceIndex,
            opcode: op.opcode,
            seq
          });
        });
      });
      return [...map.values()].sort((a, b) => {
        if (a.value === b.value) {
          return a.address.localeCompare(b.address);
        }
        return a.value < b.value ? -1 : 1;
      });
    }

    function cleanBlock(lines) {
      return lines
        .map((line) => line.replace(ansiRegex, ""))
        .join("\n")
        .trim();
    }

    function renderTraces() {
      container.innerHTML = "";
      traceData.forEach((trace, idx) => {
        const card = document.createElement("section");
        card.className = "trace-card";
        card.id = `trace-${idx}`;
        card.style.borderLeftColor = colorPalette[idx % colorPalette.length];

        const header = document.createElement("div");
        header.className = "trace-header";

        const title = document.createElement("div");
        title.className = "trace-title";
        title.textContent = trace.kind === "side"
          ? `Side Trace ${idx}`
          : `Trace ${idx}`;

        const meta = document.createElement("div");
        meta.className = "trace-meta";
        meta.textContent = trace.title || "Record";

        header.appendChild(title);
        header.appendChild(meta);
        card.appendChild(header);

        if (trace.parentTrace != null) {
          const lineage = document.createElement("div");
          lineage.className = "trace-meta";
          const parentLabel = traceData[trace.parentTrace]?.kind === "side"
            ? `Side Trace ${trace.parentTrace}`
            : `Trace ${trace.parentTrace}`;
          lineage.textContent = `From ${parentLabel} @ SNAP ${trace.snapshotIr ?? "?"}`;
          lineage.style.marginBottom = "6px";
          card.appendChild(lineage);
        }

        const grid = document.createElement("div");
        grid.className = "trace-grid";

        const bytecodeBlock = buildColumn("Bytecode", cleanBlock(trace.bytecode));
        const irBlock = buildIrColumn(trace);
        const asmLines = trace.disassemblyHeader
          ? [trace.disassemblyHeader, ...trace.asm]
          : trace.asm;
        const asmBlock = buildColumn("ASM", cleanBlock(asmLines));

        grid.appendChild(bytecodeBlock);
        grid.appendChild(irBlock);
        grid.appendChild(asmBlock);
        card.appendChild(grid);

        if (trace.notes.length) {
          const notes = document.createElement("div");
          notes.className = "trace-meta";
          notes.style.marginTop = "8px";
          notes.textContent = trace.notes.join(" | ");
          card.appendChild(notes);
        }

        container.appendChild(card);
      });
    }

    function buildIrColumn(trace) {
      const wrapper = document.createElement("div");
      wrapper.className = "column";
      const heading = document.createElement("div");
      heading.className = "column-title";
      heading.textContent = "IR / Snapshots";
      wrapper.appendChild(heading);
      const pre = document.createElement("pre");
      if (!trace.ir.length) {
        pre.textContent = "—";
        wrapper.appendChild(pre);
        return wrapper;
      }
      trace.ir.forEach((line) => {
        const cleanLine = line.replace(ansiRegex, "");
        if (cleanLine.startsWith("SNAP[")) {
          const snapSpan = document.createElement("span");
          snapSpan.className = "snap-link";
          snapSpan.textContent = cleanLine;
          const pcMatch = cleanLine.match(/pc=(0x[0-9a-fA-F]+)/i);
          if (pcMatch) {
            const { display } = normalizeAddress(pcMatch[1]);
            snapSpan.tabIndex = 0;
            const handleActivate = (event) => {
              event.preventDefault();
              highlightOpcode(display);
            };
            snapSpan.addEventListener("click", handleActivate);
            snapSpan.addEventListener("keypress", (event) => {
              if (event.key === "Enter" || event.key === " ") {
                handleActivate(event);
              }
            });
          }
          pre.appendChild(snapSpan);
        } else {
          pre.appendChild(document.createTextNode(cleanLine));
        }
        pre.appendChild(document.createTextNode("\n"));
      });
      wrapper.appendChild(pre);
      return wrapper;
    }

    function renderCoverage(limit) {
      sliderValue.textContent = `${limit}`;
      coverageCount.textContent = limit;
      opcodeTable.innerHTML = "";
      const fragment = document.createDocumentFragment();

      opcodeIndex.forEach((entry) => {
        const history = entry.history.filter((h) => h.traceIndex < limit);
        const latest = history.length ? history[history.length - 1] : null;
        const coverage = Array.from(
          new Map(
            history.map((h) => [h.traceIndex, h])
          ).values()
        );

        const row = document.createElement("div");
        row.className = "opcode-row";
        row.dataset.address = entry.address.toLowerCase();

        const addr = document.createElement("div");
        addr.className = "opcode-addr";
        addr.textContent = entry.address;

        const opcode = document.createElement("div");
        opcode.className = "opcode-name";
        opcode.textContent = latest ? latest.opcode : "—";
        if (latest) {
          opcode.title = `Updated by Trace ${latest.traceIndex}`;
        }

        const coverageCell = document.createElement("div");
        coverageCell.className = "opcode-coverage";
        if (coverage.length === 0) {
          coverageCell.textContent = "—";
        } else {
          coverage.forEach((hit) => {
            const badge = document.createElement("span");
            badge.className = "trace-badge";
            const sourceTrace = traceData[hit.traceIndex];
            const prefix = sourceTrace?.kind === "side" ? "S" : "T";
            badge.textContent = `${prefix}${hit.traceIndex}`;
            badge.style.background = colorPalette[hit.traceIndex % colorPalette.length];
            coverageCell.appendChild(badge);
          });
        }

        row.appendChild(addr);
        row.appendChild(opcode);
        row.appendChild(coverageCell);
        fragment.appendChild(row);
      });

      opcodeTable.appendChild(fragment);
      applyHighlight();
    }

    function highlightOpcode(address) {
      if (!address) {
        return;
      }
      highlightedAddress = address.toLowerCase();
      applyHighlight(true);
    }

    function applyHighlight(scroll = false) {
      if (highlightedRow) {
        highlightedRow.classList.remove("highlight");
        highlightedRow = null;
      }
      if (!highlightedAddress) {
        return;
      }
      const target = opcodeTable.querySelector(`[data-address="${highlightedAddress}"]`);
      if (!target) {
        return;
      }
      highlightedRow = target;
      target.classList.add("highlight");
      if (scroll) {
        target.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }

    window.highlightSnapFromGraph = (nodeId) => {
      const meta = snapNodeMeta[nodeId];
      console.debug("Graph snap click", { nodeId, meta });
      if (!meta) {
        console.warn("No metadata for snap node", nodeId);
        return;
      }
      if (meta.address) {
        highlightOpcode(meta.address);
        return;
      }
      if (meta.parentTrace == null) {
        console.warn("Missing parent trace for snapshot", meta);
        return;
      }
      const parentTrace = traceData[meta.parentTrace];
      if (!parentTrace) {
        console.warn("Parent trace not found for snapshot", meta);
        return;
      }
      const snapshotIndex = meta.snapshotIndex != null
        ? meta.snapshotIndex
        : resolveSnapshotIndex(parentTrace, meta.snapshotIr ?? null);
      if (snapshotIndex == null) {
        console.warn("Unable to resolve snapshot index", meta);
        return;
      }
      const snapshot = parentTrace.snapshots?.[snapshotIndex];
      if (snapshot?.pc) {
        highlightOpcode(snapshot.pc);
      } else {
        console.warn("No pc for snapshot", meta);
      }
    };

    async function renderGraph(limit = traceData.length) {
      if (!traceData.length) {
        traceGraph.innerHTML = "<div class=\"trace-meta\">No traces available.</div>";
        return;
      }
      if (!window.mermaid) {
        traceGraph.innerHTML = "<div class=\"trace-meta\">Mermaid failed to load.</div>";
        return;
      }

      if (!limit) {
        traceGraph.innerHTML = "<div class=\"trace-meta\">Move the slider to include at least one trace.</div>";
        return;
      }

      snapNodeMeta = {};
      const lines = ["graph TD", "classDef snapLabel fill:#fdf7e3,stroke:#f4c96f,color:#8a5b06;font-size:12px"];
      traceData.forEach((trace, idx) => {
        if (idx >= limit) {
          return;
        }
        const nodeId = `t${idx}`;
        const label = trace.kind === "side"
          ? `Side Trace ${idx}`
          : `Trace ${idx}`;
        lines.push(`${nodeId}["${label}"]`);
        lines.push(`click ${nodeId} "#trace-${idx}" "View ${label}"`);
      });

      traceData.forEach((trace, idx) => {
        if (idx >= limit) {
          return;
        }
        const nodeId = `t${idx}`;
        if (trace.parentTrace != null && traceData[trace.parentTrace]) {
          const parentId = `t${trace.parentTrace}`;
          const snapLabel = trace.snapshotIr != null ? `snap ${trace.snapshotIr}` : "snap ?";
          const snapNodeId = `snap_${trace.parentTrace}_${idx}`;
          lines.push(`${snapNodeId}["${snapLabel}"]:::snapLabel`);
          lines.push(`${parentId} --> ${snapNodeId}`);
          lines.push(`${snapNodeId} --> ${nodeId}`);
          lines.push(`click ${snapNodeId} highlightSnapFromGraph "Highlight ${snapLabel}"`);
          const parentTraceData = traceData[trace.parentTrace];
          const snapshotIndex = trace.snapshotIndex != null
            ? trace.snapshotIndex
            : resolveSnapshotIndex(parentTraceData, trace.snapshotIr);
          const address = snapshotIndex != null
            ? parentTraceData?.snapshots?.[snapshotIndex]?.pc ?? null
            : null;
          snapNodeMeta[snapNodeId] = {
            parentTrace: trace.parentTrace,
            snapshotIndex,
            snapshotIr: trace.snapshotIr,
            address,
            label: snapLabel
          };
        }
        (trace.links || []).forEach((link) => {
          if (link.type === "patch" && link.target != null && traceData[link.target]) {
            if (link.target >= limit) {
              return;
            }
            const label = link.snapshot != null ? `exit ${link.snapshot}` : "exit";
            lines.push(`${nodeId} -.->|${label}| t${link.target}`);
          } else if (link.type === "loop") {
            const label = link.snapshot != null ? `loop ${link.snapshot}` : "loop";
            lines.push(`${nodeId} -->|${label}| ${nodeId}`);
          }
        });
      });

      const definition = lines.join("\n");
      traceGraph.innerHTML = "<div class=\"trace-meta\">Rendering graph…</div>";
      try {
        const graphId = `traceGraph${Date.now()}`;
        currentGraphId = graphId;
        console.log("Rendering Mermaid graph", { limit, snapNodes: Object.keys(snapNodeMeta).length, graphId });
        const { svg } = await window.mermaid.render(graphId, definition);
        traceGraph.innerHTML = svg;
        attachSnapNodeHandlers();
      } catch (err) {
        traceGraph.innerHTML = `<div class="trace-meta">Graph render failed: ${err.message}</div>`;
      }
    }

    function buildColumn(title, body) {
      const wrapper = document.createElement("div");
      wrapper.className = "column";
      const heading = document.createElement("div");
      heading.className = "column-title";
      heading.textContent = title;
      const pre = document.createElement("pre");
      pre.textContent = body || "—";
      wrapper.appendChild(heading);
      wrapper.appendChild(pre);
      return wrapper;
    }

    function findSnapNodeElement(nodeId) {
      const prefixes = ["", "flowchart-", "flowchart-node-", "state-"];
      const suffixes = ["", "-0", "-1", "-2", "-label"];
      for (const prefix of prefixes) {
        for (const suffix of suffixes) {
          const base = `${prefix}${nodeId}${suffix}`;
          const candidates = [base];
          if (currentGraphId) {
            candidates.push(`${currentGraphId}_${base}`);
          }
          for (const candidate of candidates) {
            const el = traceGraph.querySelector(`#${escapeId(candidate)}`);
            if (el) {
              console.log("Found snap node by id", candidate);
              return el;
            }
          }
        }
      }
      const contains = traceGraph.querySelector(`g[id*="${nodeId}"]`);
      if (contains) {
        console.log("Found snap node by contains", contains.id);
        return contains;
      }
      const title = Array.from(traceGraph.querySelectorAll("title")).find(
        (el) => el.textContent.trim() === nodeId
      );
      if (title && title.parentElement) {
        console.log("Found snap node by title", title.textContent);
        return title.parentElement;
      }
      const labelText = snapNodeMeta[nodeId]?.label;
      if (labelText) {
        const labelNode = Array.from(traceGraph.querySelectorAll("g")).find((node) => {
          const text = node.textContent?.trim();
          return text === labelText;
        });
        if (labelNode) {
          console.log("Found snap node by label text", labelText);
          return labelNode;
        }
      }
      return null;
    }

    function attachSnapNodeHandlers() {
      const ids = Array.from(traceGraph.querySelectorAll("[id]")).map((node) => node.id);
      const titles = Array.from(traceGraph.querySelectorAll("title")).map((node) => node.textContent);
      console.log("Attaching snap handlers", { availableIds: ids, titleIds: titles });
      Object.keys(snapNodeMeta).forEach((nodeId) => {
        const node = findSnapNodeElement(nodeId);
        if (!node) {
          console.warn("Snap label node not found", nodeId);
          return;
        }
        const activate = (event) => {
          if (event) {
            event.preventDefault();
            event.stopPropagation();
          }
          highlightSnapFromGraph(nodeId);
        };
        console.log("Binding snap node", nodeId);
        node.style.cursor = "pointer";
        node.setAttribute("role", "button");
        node.setAttribute("tabindex", "0");
        node.addEventListener("click", activate);
        node.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            activate(event);
          }
        });
      });
    }

    slider.addEventListener("input", (event) => {
      const count = Number(event.target.value);
      renderCoverage(count);
      renderGraph(count);
    });

    reloadButton.addEventListener("click", () => {
      loadLog();
    });

    loadLog();
  </script>
</body>
</html>
